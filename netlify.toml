# ==============================================================================
# NETLIFY DEPLOYMENT CONFIGURATION FOR RINESH KUMAR PORTFOLIO
# ==============================================================================

[build]
  command = "echo 'No build step needed'"
  publish = "."

# Clean URL Routing for Admin Panel
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

# Security & Cache Control Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/data.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
